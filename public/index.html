<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cinematic Overthinker | Photographer & Cinematographer in Kolkata</title>
<meta name="description" content="Photographer and cinematographer in Kolkata. Weddings, events, fashion and commercial visuals.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Manrope:wght@300;400;500&family=DM+Mono&display=swap">
<style>
:root{--bg:#101010;--bg2:#181818;--card:#202020;--tx:#F1EFE9;--mu:#A6A39D;--ac:#B49A70;--bd:#303030;--hv:#D1B98F;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:300 16px/1.7 Manrope,system-ui,sans-serif}
a{color:inherit;text-decoration:none}h1,h2,h3{font:400 clamp(42px,7vw,92px)/1.02 "Instrument Serif",Georgia,serif}h2{font-size:clamp(34px,5vw,58px)}h3{font-size:28px}
.mono{font:11px "DM Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--mu)}
nav{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:calc(18px + env(safe-area-inset-top,0px)) 5vw 18px;transition:.4s}nav.s{background:rgba(16,16,16,.92)}
nav b{font:500 13px Manrope;letter-spacing:.2em;text-transform:uppercase}nav div a{font-size:12px;letter-spacing:.16em;margin-left:28px;color:var(--mu);transition:.3s;padding-bottom:4px}nav div a:hover{color:var(--hv)}nav div a.on{color:var(--tx);border-bottom:1px solid var(--ac)}
#mb{display:none;background:none;border:0;color:var(--tx);font-size:13px;letter-spacing:.2em}
@media(max-width:760px){#mb{display:block}nav div{display:none;position:absolute;top:100%;left:0;right:0;background:var(--bg);padding:10px 5vw 24px}nav.o div{display:block}nav div a{display:block;margin:14px 0}}
section.pg{display:none;min-height:100vh}section.pg.on{display:block;animation:f .7s}@keyframes f{from{opacity:0}}
.w{padding:120px 5vw 60px;max-width:1400px;margin:auto}.hero{position:relative;height:100vh;min-height:600px;background:#000 center/cover;display:flex;align-items:flex-end}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(#10101080,#101010f0)}.hero>div{position:relative;z-index:1;padding:0 5vw 70px;max-width:900px}
.hero p{color:var(--mu);max-width:560px;margin:22px 0 30px}.bar{width:60px;height:1px;background:var(--ac);margin:20px 0}
.btn{display:inline-block;border:1px solid var(--ac);padding:14px 26px;font:400 11px Manrope;letter-spacing:.2em;text-transform:uppercase;margin:0 12px 12px 0;background:none;color:var(--tx);cursor:pointer;transition:.3s}.btn:hover,.btn.f{background:var(--ac);color:#101010}.btn:hover{border-color:var(--hv);background:var(--hv)}
.grid{columns:3 280px;column-gap:18px;margin-top:40px}.pj{break-inside:avoid;margin-bottom:18px;position:relative;overflow:hidden;cursor:pointer;background:var(--card)}
.pj .im{width:100%;display:block;aspect-ratio:var(--r,4/5);object-fit:cover;background:var(--card);transition:transform .8s}.pj:hover .im{transform:scale(1.04)}
.pj .cap{position:absolute;left:0;right:0;bottom:0;padding:50px 18px 16px;background:linear-gradient(transparent,#101010e6)}.pj .cap h3{font-size:26px;line-height:1.1}
.ph{display:flex;align-items:center;justify-content:center;aspect-ratio:var(--r,4/5);background:var(--card);color:var(--mu);font:11px "DM Mono";letter-spacing:.14em}
.fl{display:flex;flex-wrap:wrap;gap:6px 26px;margin:34px 0 0}.fl button{background:none;border:0;color:var(--mu);font:400 12px Manrope;letter-spacing:.18em;padding:6px 0;cursor:pointer;border-bottom:1px solid transparent}.fl button.on{color:var(--tx);border-color:var(--ac)}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:0;border-top:1px solid var(--bd);margin-top:40px}.row>div{padding:30px 24px 30px 0;border-bottom:1px solid var(--bd)}.row p{color:var(--mu);font-size:15px;margin-top:8px}
.row img,.row .ph{width:100%;aspect-ratio:4/3;object-fit:cover;margin-bottom:18px}
.num{font:400 64px "Instrument Serif"}.sec{border-top:1px solid var(--bd);margin-top:70px;padding-top:70px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:start}@media(max-width:800px){.two{grid-template-columns:1fr;gap:30px}}
.two img{width:100%;display:block}ul.l{list-style:none;padding:0;margin:14px 0 22px;color:var(--mu)}ul.l li{padding:7px 0;border-bottom:1px solid var(--bd)}
form{display:grid;gap:18px}label{font:11px "DM Mono";letter-spacing:.12em;color:var(--mu);text-transform:uppercase;display:grid;gap:6px}
input,select,textarea{background:var(--bg2);border:1px solid var(--bd);color:var(--tx);padding:13px;font:300 15px Manrope;border-radius:0;width:100%}input:focus,select:focus,textarea:focus{outline:0;border-color:var(--ac)}.g2{display:grid;grid-template-columns:1fr 1fr;gap:18px}@media(max-width:560px){.g2{grid-template-columns:1fr}}
footer{border-top:1px solid var(--bd);padding:60px 5vw 40px;display:flex;flex-wrap:wrap;gap:30px;justify-content:space-between;color:var(--mu);font-size:14px}footer a{display:block;margin:4px 0}footer a:hover{color:var(--hv)}
.rv{opacity:0;transform:translateY(22px);transition:1s}.rv.v{opacity:1;transform:none}
#md{position:fixed;inset:0;background:#101010f5;z-index:40;overflow:auto;display:none;padding:80px 5vw 40px}#md.on{display:block}#md img{width:100%;display:block;margin:0 0 14px}
.x{position:fixed;top:calc(20px + env(safe-area-inset-top,0px));right:5vw;z-index:41;background:none;border:0;color:var(--tx);font-size:13px;letter-spacing:.2em;cursor:pointer}
#ad{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--card);border:1px solid var(--ac);padding:10px 14px;display:none;gap:8px 14px;flex-wrap:wrap;align-items:center;font-size:12px}#ad .btn{padding:8px 14px;margin:0}
.ed [data-k]{outline:1px dashed #B49A7099;outline-offset:3px;cursor:text}#ok{color:var(--ac);font-size:13px}

.admin-overlay{display:none;position:fixed;inset:0;z-index:70;overflow:auto;background:rgba(8,8,8,.97);padding:28px 18px 50px}
.admin-overlay.on{display:block}.admin-shell{max-width:1200px;margin:0 auto}
.admin-head{display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:1px solid var(--bd);padding:12px 0 22px;margin-bottom:22px}
.admin-head h2{font-size:38px}.admin-nav{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 26px}
.admin-nav button,.admin-action{border:1px solid var(--bd);background:var(--bg2);color:var(--tx);padding:10px 14px;font:11px "DM Mono";letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.admin-nav button.on,.admin-action.primary{background:var(--ac);color:#101010;border-color:var(--ac)}
.admin-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:18px 0 26px}
.admin-card{background:var(--bg2);border:1px solid var(--bd);padding:18px}.admin-card .num{font-size:42px}
.admin-muted{color:var(--mu);font-size:13px}.admin-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:18px 0}
.admin-toolbar input,.admin-toolbar select{max-width:260px}.admin-list{border-top:1px solid var(--bd)}
.admin-project{display:grid;grid-template-columns:minmax(180px,1fr) auto;gap:16px;align-items:center;padding:16px 0;border-bottom:1px solid var(--bd)}
.admin-project h3{font:500 15px Manrope;line-height:1.4}.admin-project-actions{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.admin-project-actions button{padding:8px 10px;font-size:10px}
.admin-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px;margin-top:18px}
.admin-form label{min-width:0}.admin-form .wide{grid-column:1/-1}.admin-form textarea{min-height:100px}
.admin-checks{display:flex;gap:18px;flex-wrap:wrap;padding:6px 0}.admin-checks label{display:flex;align-items:center;gap:8px}
.admin-checks input{width:auto}.admin-form-footer{display:flex;gap:10px;flex-wrap:wrap;grid-column:1/-1;border-top:1px solid var(--bd);padding-top:18px}
.admin-note{font-size:12px;color:var(--mu);margin-top:10px}.login-card{max-width:440px;margin:10vh auto;background:var(--bg2);border:1px solid var(--bd);padding:26px}
.login-card h2{font-size:38px;margin-bottom:12px}.login-card form{margin-top:18px}
@media(max-width:680px){.admin-overlay{padding:16px 14px 40px}.admin-head{align-items:flex-start}.admin-head h2{font-size:30px}.admin-project{grid-template-columns:1fr}.admin-project-actions{justify-content:flex-start}.admin-form{grid-template-columns:1fr}.admin-form .wide,.admin-form-footer{grid-column:1}.admin-toolbar input,.admin-toolbar select{max-width:none;width:100%}}

</style></head><body>
<nav id="nv"><a href="#home"><b data-k="brand">Cinematic Overthinker</b></a><button id="mb" aria-label="Menu">MENU</button><div><a href="#home">HOME</a><a href="#work">WORK</a><a href="#services">SERVICES</a><a href="#about">ABOUT</a><a href="#contact">CONTACT</a></div></nav>
<main id="app"></main>
<footer id="ft"></footer>
<div id="md"><button class="x" id="mdClose" type="button">CLOSE ✕</button><div id="mc"></div></div>
<div id="ad"><span class="mono">ADMIN SESSION ACTIVE</span><button class="btn" id="openAdmin">OPEN STUDIO DASHBOARD</button><button class="btn" id="logoutAdmin">LOG OUT</button><span id="ok"></span></div>
<div id="adminPanel" class="admin-overlay" aria-hidden="true"></div>
<div id="loginPanel" class="admin-overlay" aria-hidden="true"><div class="login-card"><button class="x" id="loginClose" type="button">CLOSE ✕</button><span class="mono">ROHIT CLICKS / PRIVATE ACCESS</span><h2>Admin login.</h2><p class="admin-muted">Enter the admin email address. A one-time code will be sent if the address is authorised.</p><form id="loginForm"><label>Email address<input id="loginEmail" type="email" autocomplete="email" required></label><div id="codeWrap" hidden><label>Six-digit code<input id="loginCode" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code"></label></div><button class="btn f" id="loginSubmit" type="submit">SEND LOGIN CODE</button><p id="loginStatus" class="admin-note" role="status"></p></form></div></div>

document.addEventListener("click",e=>{const a=e.target.closest('a[href="#admin"]');if(!a)return;e.preventDefault();if(window.openLogin)window.openLogin()});

function renderProjectRows(){const list=$("#projectList");if(!list)return;const q=$("#projectSearch").value.trim().toLowerCase(),cat=$("#projectCategory").value,state=$("#projectStatus").value,items=D.projects.filter(p=>(cat==="all"||p.cat===cat)&&(state==="all"||(state==="published"&&p.published)||(state==="draft"&&!p.published)||(state==="featured"&&p.featured))&&[p.title,p.client,p.summary,p.tags.join(" ")].join(" ").toLowerCase().includes(q));$("#projectCount").textContent=items.length+" project(s) shown · "+D.projects.length+" total";list.innerHTML=items.map(p=>"<div class=\"admin-project\"><div><h3>"+esc(p.title)+"</h3><p class=\"admin-muted\">"+esc(p.cat)+" · "+esc(p.year||"Year not set")+" · "+(p.published?"Published":"Draft")+(p.featured?" · Featured":"")+(p.client?" · "+esc(p.client):"")+"</p><p class=\"admin-muted\">"+esc(p.summary||"No summary added yet.")+"</p></div><div class=\"admin-project-actions\"><button class=\"admin-action\" data-action=\"edit\" data-id=\""+esc(p.id)+"\">Edit</button><button class=\"admin-action\" data-action=\"publish\" data-id=\""+esc(p.id)+"\">"+(p.published?"Unpublish":"Publish")+"</button><button class=\"admin-action\" data-action=\"feature\" data-id=\""+esc(p.id)+"\">"+(p.featured?"Unfeature":"Feature")+"</button><button class=\"admin-action\" data-action=\"up\" data-id=\""+esc(p.id)+"\">↑</button><button class=\"admin-action\" data-action=\"down\" data-id=\""+esc(p.id)+"\">↓</button><button class=\"admin-action\" data-action=\"duplicate\" data-id=\""+esc(p.id)+"\">Duplicate</button><button class=\"admin-action\" data-action=\"delete\" data-id=\""+esc(p.id)+"\">Delete</button></div></div>").join("")||"<p class=\"admin-muted\" style=\"padding:22px 0\">No projects match these filters. Add a new project or change the search.</p>";list.onclick=e=>{const b=e.target.closest("[data-action]");if(!b)return;const p=D.projects.find(x=>x.id===b.dataset.id);if(!p)return;const a=b.dataset.action;if(a==="edit")return openProjectEditor(p.id);if(a==="delete"){if(!confirm("Delete "+p.title+"? This cannot be undone."))return;D.projects=D.projects.filter(x=>x.id!==p.id)}if(a==="duplicate")D.projects.unshift(normalProject({...p,id:"p"+Date.now(),title:p.title+" (Copy)",published:false,featured:false,createdAt:new Date().toISOString()},D.projects.length));if(a==="publish")p.published=!p.published;if(a==="feature")p.featured=!p.featured;if(a==="up"||a==="down"){const i=D.projects.indexOf(p),j=a==="up"?i-1:i+1;if(j>=0&&j<D.projects.length)[D.projects[i],D.projects[j]]=[D.projects[j],D.projects[i]]}sv().then(()=>renderAdmin("projects"))}}
function openProjectEditor(id){if(!admin)return;const old=id?D.projects.find(p=>p.id===id):null,p=old||{id:"",title:"",cat:"events",year:new Date().getFullYear().toString(),client:"",location:settings().location,summary:"",description:"",services:[],tags:[],projectUrl:"",videoUrl:"",featured:false,published:true,order:D.projects.length,ph:[]},body=$("#adminBody");let categoryOptions=CATS.map(c=>"<option value=\""+c+"\" "+(p.cat===c?"selected":"")+">"+c+"</option>").join("");body.innerHTML="<div class=\"admin-card\"><span class=\"mono\">"+(old?"EDIT PROJECT":"NEW PROJECT")+"</span><h3 style=\"margin:10px 0 4px\">"+(old?"Update project details":"Add a project to your portfolio")+"</h3><p class=\"admin-muted\">No photo upload is included. New project entries are text and metadata only.</p><form id=\"projectForm\" class=\"admin-form\"><label>Project title *<input name=\"title\" maxlength=\"120\" value=\""+esc(p.title)+"\" required></label><label>Category<select name=\"cat\">"+categoryOptions+"</select></label><label>Client / brand<input name=\"client\" maxlength=\"120\" value=\""+esc(p.client)+"\"></label><label>Year<input name=\"year\" type=\"number\" min=\"1900\" max=\"2200\" value=\""+esc(p.year)+"\"></label><label>Location<input name=\"location\" maxlength=\"120\" value=\""+esc(p.location)+"\"></label><label>Display order<input name=\"order\" type=\"number\" value=\""+esc(p.order)+"\"></label><label class=\"wide\">Short summary<input name=\"summary\" maxlength=\"240\" value=\""+esc(p.summary)+"\"></label><label class=\"wide\">Project description<textarea name=\"description\" maxlength=\"4000\">"+esc(p.description)+"</textarea></label><label>Services delivered<input name=\"services\" value=\""+esc(p.services.join(", "))+"\" placeholder=\"Photography, cinematography, editing\"></label><label>Tags<input name=\"tags\" value=\""+esc(p.tags.join(", "))+"\" placeholder=\"Wedding, editorial, Kolkata\"></label><label>External project URL<input name=\"projectUrl\" type=\"url\" value=\""+esc(p.projectUrl)+"\" placeholder=\"https://...\"></label><label>Film / video URL<input name=\"videoUrl\" type=\"url\" value=\""+esc(p.videoUrl)+"\" placeholder=\"https://...\"></label><div class=\"admin-checks wide\"><label><input name=\"featured\" type=\"checkbox\" "+(p.featured?"checked":"")+"> Featured on homepage</label><label><input name=\"published\" type=\"checkbox\" "+(p.published?"checked":"")+"> Published on website</label></div><div class=\"admin-form-footer\"><button class=\"btn f\" type=\"submit\">SAVE PROJECT</button><button class=\"btn\" id=\"cancelProject\" type=\"button\">CANCEL</button>"+(old?"<button class=\"btn\" id=\"deleteFromEditor\" type=\"button\">DELETE PROJECT</button>":"")+"</div></form></div>";$("#cancelProject").onclick=()=>renderAdmin("projects");const f=$("#projectForm");f.onsubmit=e=>{e.preventDefault();const v=Object.fromEntries(new FormData(f));if(!v.title.trim()){alert("Project title is required.");return}const project={...p,id:old?p.id:"p"+Date.now(),title:v.title.trim(),cat:CATS.includes(v.cat)?v.cat:"creative",client:v.client.trim(),year:v.year.trim(),location:v.location.trim(),summary:v.summary.trim(),description:v.description.trim(),services:splitList(v.services),tags:splitList(v.tags),projectUrl:validHttps(v.projectUrl),videoUrl:validHttps(v.videoUrl),featured:f.elements.featured.checked,published:f.elements.published.checked,order:Number(v.order)||0,ph:old?(old.ph||[]):[],createdAt:old?(old.createdAt||""):new Date().toISOString(),updatedAt:new Date().toISOString()};if(old){const i=D.projects.findIndex(x=>x.id===old.id);D.projects[i]=normalProject(project,i)}else D.projects.push(normalProject(project,D.projects.length));D.projects.sort((a,b)=>a.order-b.order);sv().then(ok=>{if(ok){render();renderAdmin("projects")}})};const del=$("#deleteFromEditor");if(del)del.onclick=()=>{if(confirm("Delete this project?")){D.projects=D.projects.filter(x=>x.id!==old.id);sv().then(()=>renderAdmin("projects"))}}}
