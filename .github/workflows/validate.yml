name: Validate portfolio

on:
  push:
    branches: ["main", "fix/admin-project-manager", "feat/admin-photo-manager"]
  pull_request:
    branches: ["main"]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install and verify Vercel Blob SDK
        run: |
          npm install --ignore-scripts --no-audit --no-fund --package-lock=false
          node --input-type=module -e "const blob = await import('@vercel/blob'); const client = await import('@vercel/blob/client'); for (const [name, value] of [['del', blob.del], ['put', blob.put], ['handleUpload', client.handleUpload]]) { if (typeof value !== 'function') throw new Error('Missing @vercel/blob export: ' + name); }"
      - name: Check API JavaScript syntax
        run: |
          for file in api/*.js; do
            echo "Checking $file"
            node --check "$file"
          done
      - name: Check inline browser scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("public/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, flags=re.S)
          if not scripts:
              raise SystemExit("No inline scripts found")
          for index, script in enumerate(scripts):
              Path(f"/tmp/portfolio-script-{index}.js").write_text(script, encoding="utf-8")
          print(f"Extracted {len(scripts)} inline script(s)")
          PY
          for file in /tmp/portfolio-script-*.js; do
            echo "Checking $file"
            node --check "$file"
          done
      - name: Check admin and photo manager behavior
        run: |
          grep -q "Studio dashboard" public/index.html
          grep -q "NEW PROJECT" public/index.html
          grep -q "featured" public/index.html
          test ! -e api/upload.js
          test -f api/photo.js
          grep -q "Photos" public/index.html
          grep -q "ADD PHOTOS" public/index.html
          grep -q "REPLACE" public/index.html
          grep -q "DELETE" public/index.html
          grep -q "handleUpload" api/photo.js
          grep -q "blobSdk.put(pathname,file" public/index.html
          grep -q "https://esm.sh/@vercel/blob@2.9.0?bundle" public/index.html
          grep -q "blob.generate-client-token" public/index.html
          grep -q 'credentials:"same-origin"' public/index.html
          grep -q '"@vercel/blob":"^2.9.0"' package.json
          grep -q "maximumSizeInBytes: MAX_PHOTO_BYTES" api/photo.js
          grep -q "IMG2" public/index.html
